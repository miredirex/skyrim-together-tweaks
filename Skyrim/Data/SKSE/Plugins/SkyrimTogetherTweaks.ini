; Various tweaks and utilities for Skyrim Together 1.8.x

[General]
; enforces reliable UI activation, may require disabling Nvidia Photo Mode
bEnableF2Fix = true
; changes UI activation key (F2 = 0x71); to remap, see https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
uUiKeyCode = 0x71
; disables Right Ctrl button from activating the UI menu
bDisableRCtrl = false
; enables the console where Skyrim Together prints debug logs
bEnableConsole = false

[Experiments]
; adjusts the so called "artificial delay". tweaking this may result in a more responsive player movement - that is if you know what you're doing. try experimenting with lower values e.g. 120-150, especially if you're on LAN
uInterpolationBufferMs = 300
; enforces instant animations, meaning no artificial delays. works best with lower 'uInterpolationBufferMs'
bNoAnimationDelay = false
; makes enemies more attracted to you in combat (1.0 is default); set to 1.5-2.0 for more fun
bMobsAggroMultiplier = 1.0
