; Various tweaks and utilities for Skyrim Together 1.8.x

[General]
; enforces reliable UI activation, may require disabling Nvidia Photo Mode
bEnableF2Fix = true
; enables the console where Skyrim Together prints debug logs
bEnableConsole = false

[Keys]
; changes UI activation key (F2 = 0x71); to remap, see https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
uUiKeyCode = 0x71
; changes debug menu activation key (F3 = 0x72); to remap, see ↑
uDebugMenuKeyCode = 0x72
; disables Right Ctrl button from activating the UI menu
bDisableRCtrl = false

[Experimental]
; adjusts the so-called "artificial delay". tweaking this value may result in a more responsive player movement. try experimenting 
; with lower values e.g. 120-150, especially if you're on LAN. setting particularly low values can result in jittery movement
uInterpolationBufferMs = 300
; enforces instant animations, meaning no interpolation delays. works best with lower 'uInterpolationBufferMs'
bNoAnimationDelay = false
; makes enemies more attracted to you in combat (1.0 is default); set to 1.5-2.0 for more fun
fMobsAggroMultiplier = 1.0
